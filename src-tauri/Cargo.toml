[package]
name = "ebook_reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Linux bookshelf for local PDF and EPUB files"
license = "MIT"

[lib]
name = "ebook_reader_lib"
crate-type = ["rlib"]

[[bin]]
name = "ebook-reader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
libc = "0.2"
pango = "0.22"
pangocairo = "0.22"
poppler-rs = "0.26"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
zip = "2"
