<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <p class="app-name">Mar-Elias Books</p>
        <p class="section">Library</p>
        <nav id="library-nav" aria-label="Library"></nav>
        <div class="section-row">
          <p class="section">Categories</p>
          <button id="new-category" class="text icon" type="button" aria-label="Add category">+</button>
        </div>
        <nav id="category-nav" aria-label="Categories"></nav>
        <div class="section-row">
          <p class="section">Tags</p>
          <button id="new-tag" class="text icon" type="button" aria-label="Add tag">+</button>
        </div>
        <nav id="tag-nav" aria-label="Tags"></nav>
        <div class="section-row">
          <p class="section">Lists</p>
          <button id="new-list" class="text icon" type="button" aria-label="New list">+</button>
        </div>
        <div id="list-nav"></div>
      </aside>
      <main>
        <header>
          <button id="back" class="text" type="button" hidden>Back</button>
          <h1 id="heading">All books</h1>
          <div class="header-actions">
            <div class="zoom" role="group" aria-label="Zoom">
              <button id="zoom-out" class="text" type="button" aria-label="Zoom out">−</button>
              <button id="zoom-in" class="text" type="button" aria-label="Zoom in">+</button>
            </div>
            <input id="search" type="search" placeholder="Search" aria-label="Search" />
            <button id="add-book" class="primary" type="button">Add book</button>
          </div>
        </header>
        <div id="content"></div>
      </main>
    </div>

    <div id="menu" role="menu" hidden></div>
    <p id="toast" role="status" hidden></p>

    <dialog id="book-dialog">
      <form id="book-form">
        <h2 id="book-dialog-title">Add book</h2>
        <label>Book <input id="field-file" type="text" spellcheck="false" /></label>
        <label>Cover <input id="field-cover" type="text" spellcheck="false" /></label>
        <label>Title <input id="field-title" type="text" /></label>
        <label>Author <input id="field-author" type="text" /></label>
        <label>Year <input id="field-year" type="text" inputmode="numeric" /></label>
        <div class="color-field" id="book-colors">
          <span>Color</span>
          <div class="swatches" role="radiogroup" aria-label="Color">
            <button type="button" class="swatch none" data-color="" aria-label="No color" aria-pressed="true"></button>
            <button type="button" class="swatch" data-color="#f9c650" aria-label="#f9c650"></button>
            <button type="button" class="swatch" data-color="#ff8a00" aria-label="#ff8a00"></button>
            <button type="button" class="swatch" data-color="#fa517e" aria-label="#fa517e"></button>
            <button type="button" class="swatch" data-color="#71c15d" aria-label="#71c15d"></button>
            <button type="button" class="swatch" data-color="#5ea7ef" aria-label="#5ea7ef"></button>
            <button type="button" class="swatch" data-color="#c17ad5" aria-label="#c17ad5"></button>
            <button type="button" class="swatch" data-color="#fce94f" aria-label="#fce94f"></button>
          </div>
        </div>
        <div class="picker" id="category-picker" data-empty="Add one with + in the sidebar.">
          <span>Categories</span>
          <button type="button" class="picker-button"><span>None</span></button>
          <div class="picker-menu" hidden></div>
        </div>
        <div class="picker" id="tag-picker" data-empty="Add one with + in the sidebar.">
          <span>Tags</span>
          <button type="button" class="picker-button"><span>None</span></button>
          <div class="picker-menu" hidden></div>
        </div>
        <div class="picker" id="list-picker" data-empty="No lists yet.">
          <span>Lists</span>
          <button type="button" class="picker-button"><span>None</span></button>
          <div class="picker-menu" hidden></div>
        </div>
        <img id="cover-preview" alt="" hidden />
        <p id="book-status"></p>
        <div class="dialog-actions">
          <button id="book-cancel" type="button">Cancel</button>
          <button id="book-save" class="primary" type="submit">Save</button>
        </div>
        <button id="book-delete" class="danger" type="button" hidden>Delete book</button>
      </form>
    </dialog>

    <dialog id="prompt-dialog">
      <form id="prompt-form">
        <h2 id="prompt-title">New list</h2>
        <input id="prompt-input" type="text" />
        <div class="dialog-actions">
          <button id="prompt-cancel" type="button">Cancel</button>
          <button id="prompt-ok" class="primary" type="submit">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form id="confirm-form">
        <h2 id="confirm-title">Remove book?</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" class="danger" type="submit">Remove</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
