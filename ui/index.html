<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Books</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="sidebar-scroll">
        <p class="app-name">Mar-Elias Books</p>
        <p class="section"><b>Library</b></p>
        <nav id="library-nav" aria-label="Library"></nav>
        <div class="section-row">
          <button id="toggle-categories" class="section-toggle" type="button" aria-expanded="true" aria-controls="category-nav">
            <svg class="section-chevron" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
              <path fill="currentColor" d="M3.4 5.6 8 10.8 12.6 5.6Z" />
            </svg>
            <span class="section"><b>Categories</b></span>
          </button>
          <button id="manage-categories" class="text icon hint" type="button" data-hint="Edit" aria-label="Manage categories">···</button>
        </div>
        <nav id="category-nav" aria-label="Categories"></nav>
        <div class="section-row">
          <button id="toggle-tags" class="section-toggle" type="button" aria-expanded="true" aria-controls="tag-nav">
            <svg class="section-chevron" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
              <path fill="currentColor" d="M3.4 5.6 8 10.8 12.6 5.6Z" />
            </svg>
            <span class="section"><b>Tags</b></span>
          </button>
          <button id="manage-tags" class="text icon hint" type="button" data-hint="Edit" aria-label="Manage tags">···</button>
        </div>
        <nav id="tag-nav" aria-label="Tags"></nav>
        <div class="section-row">
          <p class="section"><b>Lists</b></p>
          <button id="manage-lists" class="text icon hint" type="button" data-hint="Edit" aria-label="Manage lists">···</button>
        </div>
        <div id="list-nav"></div>
        </div>
        <div class="sidebar-foot">
          <button id="settings" class="text hint" type="button" data-hint="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" fill-rule="evenodd" d="M6.55 3.53 6.26 1.01 9.74 1.01 9.45 3.53 10.13 3.81 11.71 1.83 14.17 4.29 12.19 5.87 12.47 6.55 14.99 6.26 14.99 9.74 12.47 9.45 12.19 10.13 14.17 11.71 11.71 14.17 10.13 12.19 9.45 12.47 9.74 14.99 6.26 14.99 6.55 12.47 5.87 12.19 4.29 14.17 1.83 11.71 3.81 10.13 3.53 9.45 1.01 9.74 1.01 6.26 3.53 6.55 3.81 5.87 1.83 4.29 4.29 1.83 5.87 3.81Z M10 8a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z" />
            </svg>
          </button>
        </div>
      </aside>
      <main>
        <header>
          <button id="back" class="text" type="button" hidden>Back</button>
          <h1 id="heading">All books</h1>
          <div class="header-actions">
            <div class="shelf-sort">
              <select id="book-sort" aria-label="Sort books">
                <option value="title">Alphabetically</option>
                <option value="added-desc">Date added (newer first)</option>
                <option value="added-asc">Date added (older first)</option>
                <option value="modified-desc">Date modified (newer first)</option>
                <option value="modified-asc">Date modified (older first)</option>
                <option value="rating-desc">Rating (highest first)</option>
                <option value="rating-asc">Rating (lowest first)</option>
              </select>
            </div>
            <div class="zoom" role="group" aria-label="Zoom">
              <button id="zoom-out" class="text" type="button" aria-label="Zoom out">−</button>
              <span class="zoom-mark" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="14" height="14">
                  <circle cx="6.75" cy="6.75" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
                  <path d="M10 10.1 13.2 13.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </span>
              <span id="zoom-level" class="zoom-level" aria-live="polite">100%</span>
              <button id="zoom-in" class="text" type="button" aria-label="Zoom in">+</button>
            </div>
            <input id="search" type="search" placeholder="Search" aria-label="Search" />
            <button id="add-book" class="primary" type="button">Add book</button>
          </div>
        </header>
        <div id="content"></div>
      </main>
    </div>

    <div id="menu" role="menu" hidden></div>
    <p id="toast" role="status" hidden></p>

    <dialog id="book-dialog">
      <form id="book-form">
        <h2 id="book-dialog-title">Add book</h2>
        <div class="book-fields">
          <label class="wide">Book path <input id="field-file" type="text" spellcheck="false" /></label>
          <label class="wide">Cover path <input id="field-cover" type="text" spellcheck="false" /></label>
          <label class="wide">Notes path <input id="field-notes-path" type="text" spellcheck="false" /></label>
          <label>Title <input id="field-title" type="text" /></label>
          <label>Author <input id="field-author" type="text" /></label>
          <div class="date-fields" id="book-dates">
            <label>Year <input id="field-year" type="text" inputmode="numeric" /></label>
            <label>Date added <input id="field-added" type="text" readonly /></label>
            <label>Date modified <input id="field-modified" type="text" readonly /></label>
          </div>
          <div class="mark-fields">
            <div class="color-field" id="book-colors">
              <span>Color</span>
              <div class="swatches" role="radiogroup" aria-label="Color">
                <button type="button" class="swatch none" data-color="" aria-label="No color" aria-pressed="true"></button>
                <button type="button" class="swatch" data-color="#f9c650" aria-label="#f9c650"></button>
                <button type="button" class="swatch" data-color="#ff8a00" aria-label="#ff8a00"></button>
                <button type="button" class="swatch" data-color="#fa517e" aria-label="#fa517e"></button>
                <button type="button" class="swatch" data-color="#71c15d" aria-label="#71c15d"></button>
                <button type="button" class="swatch" data-color="#5ea7ef" aria-label="#5ea7ef"></button>
                <button type="button" class="swatch" data-color="#c17ad5" aria-label="#c17ad5"></button>
                <button type="button" class="swatch" data-color="#fce94f" aria-label="#fce94f"></button>
              </div>
            </div>
            <div class="rating-field" id="book-rating">
              <span>Rating</span>
              <div class="ratings" role="radiogroup" aria-label="Rating">
                <button type="button" id="rating-clear" class="rating-clear" aria-label="Clear rating" aria-pressed="true"></button>
                <button type="button" class="rating" data-rating="1" aria-label="1 star" aria-pressed="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .9 7.5 4.5h3.8L8.3 6.8l1 3.7L6 8.5 2.7 10.5l1-3.7L.7 4.5h3.8Z" /></svg>
                </button>
                <button type="button" class="rating" data-rating="2" aria-label="2 stars" aria-pressed="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .9 7.5 4.5h3.8L8.3 6.8l1 3.7L6 8.5 2.7 10.5l1-3.7L.7 4.5h3.8Z" /></svg>
                </button>
                <button type="button" class="rating" data-rating="3" aria-label="3 stars" aria-pressed="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .9 7.5 4.5h3.8L8.3 6.8l1 3.7L6 8.5 2.7 10.5l1-3.7L.7 4.5h3.8Z" /></svg>
                </button>
                <button type="button" class="rating" data-rating="4" aria-label="4 stars" aria-pressed="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .9 7.5 4.5h3.8L8.3 6.8l1 3.7L6 8.5 2.7 10.5l1-3.7L.7 4.5h3.8Z" /></svg>
                </button>
                <button type="button" class="rating" data-rating="5" aria-label="5 stars" aria-pressed="false">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .9 7.5 4.5h3.8L8.3 6.8l1 3.7L6 8.5 2.7 10.5l1-3.7L.7 4.5h3.8Z" /></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="choice-fields">
            <div class="picker" id="category-picker" data-empty="Add one from the Categories menu.">
              <span>Categories</span>
              <button type="button" class="picker-button"><span>None</span></button>
              <div class="picker-menu" hidden></div>
            </div>
            <div class="picker" id="tag-picker" data-empty="Add one from the Tags menu.">
              <span>Tags</span>
              <button type="button" class="picker-button"><span>None</span></button>
              <div class="picker-menu" hidden></div>
            </div>
            <div class="picker" id="list-picker" data-empty="Add one from the Lists menu.">
              <span>Lists</span>
              <button type="button" class="picker-button"><span>None</span></button>
              <div class="picker-menu" hidden></div>
            </div>
          </div>
          <div class="detail-row">
            <label>Notes <textarea id="field-notes" rows="7" dir="auto"></textarea></label>
            <div id="cover-preview-frame" hidden>
              <img id="cover-preview" alt="" />
              <span id="notes-preview" class="notes-mark" hidden aria-label="Notes">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="currentColor" fill-rule="evenodd" d="M15.6729 3.91287C16.8918 2.69392 18.8682 2.69392 20.0871 3.91287C21.3061 5.13182 21.3061 7.10813 20.0871 8.32708L14.1499 14.2643C13.3849 15.0293 12.3925 15.5255 11.3215 15.6785L9.14142 15.9899C8.82983 16.0344 8.51546 15.9297 8.29289 15.7071C8.07033 15.4845 7.96554 15.1701 8.01005 14.8586L8.32149 12.6785C8.47449 11.6075 8.97072 10.615 9.7357 9.85006L15.6729 3.91287ZM18.6729 5.32708C18.235 4.88918 17.525 4.88918 17.0871 5.32708L11.1499 11.2643C10.6909 11.7233 10.3932 12.3187 10.3014 12.9613L10.1785 13.8215L11.0386 13.6986C11.6812 13.6068 12.2767 13.3091 12.7357 12.8501L18.6729 6.91287C19.1108 6.47497 19.1108 5.76499 18.6729 5.32708ZM11 3.99929C11.0004 4.55157 10.5531 4.99963 10.0008 5.00007C9.00227 5.00084 8.29769 5.00827 7.74651 5.06064C7.20685 5.11191 6.88488 5.20117 6.63803 5.32695C6.07354 5.61457 5.6146 6.07351 5.32698 6.63799C5.19279 6.90135 5.10062 7.24904 5.05118 7.8542C5.00078 8.47105 5 9.26336 5 10.4V13.6C5 14.7366 5.00078 15.5289 5.05118 16.1457C5.10062 16.7509 5.19279 17.0986 5.32698 17.3619C5.6146 17.9264 6.07354 18.3854 6.63803 18.673C6.90138 18.8072 7.24907 18.8993 7.85424 18.9488C8.47108 18.9992 9.26339 19 10.4 19H13.6C14.7366 19 15.5289 18.9992 16.1458 18.9488C16.7509 18.8993 17.0986 18.8072 17.362 18.673C17.9265 18.3854 18.3854 17.9264 18.673 17.3619C18.7988 17.1151 18.8881 16.7931 18.9393 16.2535C18.9917 15.7023 18.9991 14.9977 18.9999 13.9992C19.0003 13.4469 19.4484 12.9995 20.0007 13C20.553 13.0004 21.0003 13.4485 20.9999 14.0007C20.9991 14.9789 20.9932 15.7808 20.9304 16.4426C20.8664 17.116 20.7385 17.7136 20.455 18.2699C19.9757 19.2107 19.2108 19.9756 18.27 20.455C17.6777 20.7568 17.0375 20.8826 16.3086 20.9421C15.6008 21 14.7266 21 13.6428 21H10.3572C9.27339 21 8.39925 21 7.69138 20.9421C6.96253 20.8826 6.32234 20.7568 5.73005 20.455C4.78924 19.9756 4.02433 19.2107 3.54497 18.2699C3.24318 17.6776 3.11737 17.0374 3.05782 16.3086C2.99998 15.6007 2.99999 14.7266 3 13.6428V10.3572C2.99999 9.27337 2.99998 8.39922 3.05782 7.69134C3.11737 6.96249 3.24318 6.3223 3.54497 5.73001C4.02433 4.7892 4.78924 4.0243 5.73005 3.54493C6.28633 3.26149 6.88399 3.13358 7.55735 3.06961C8.21919 3.00673 9.02103 3.00083 9.99922 3.00007C10.5515 2.99964 10.9996 3.447 11 3.99929Z" />
                </svg>
              </span>
            </div>
          </div>
        </div>
        <p id="book-status"></p>
        <div class="dialog-actions">
          <button id="book-delete" class="danger" type="button" hidden>Delete book</button>
          <span class="dialog-actions-end">
            <button id="book-cancel" type="button">Cancel</button>
            <button id="book-save" class="primary" type="submit">Save</button>
          </span>
        </div>
      </form>
    </dialog>

    <dialog id="prompt-dialog">
      <form id="prompt-form">
        <h2 id="prompt-title">New list</h2>
        <input id="prompt-input" type="text" />
        <div class="dialog-actions">
          <button id="prompt-cancel" type="button">Cancel</button>
          <button id="prompt-ok" class="primary" type="submit">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form id="confirm-form">
        <h2 id="confirm-title">Remove book?</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirm-cancel" type="button">Cancel</button>
          <button id="confirm-ok" class="danger" type="submit">Remove</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form">
        <h2>Settings</h2>
        <label>Open books with
          <input id="settings-reader" type="text" spellcheck="false" placeholder="/usr/bin/okular" />
        </label>
        <label>File manager
          <input id="settings-file-manager" type="text" spellcheck="false" placeholder="/usr/local/bin/dolphin" />
        </label>
        <label>Library database path
          <input id="settings-database" type="text" readonly spellcheck="false" />
        </label>
        <label>Covers folder path (automatically generated)
          <input id="settings-covers" type="text" readonly spellcheck="false" />
        </label>
        <p id="settings-status"></p>
        <div class="dialog-actions">
          <button id="settings-cancel" type="button">Cancel</button>
          <button id="settings-close" class="primary" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="catalog-dialog">
      <form id="catalog-form">
        <div class="catalog-head">
          <h2 id="catalog-title">Categories</h2>
          <button id="catalog-add" class="text icon" type="button" aria-label="Add">+</button>
        </div>
        <label class="catalog-sort">Sort by
          <select id="catalog-sort">
            <option value="name">Alphabetically</option>
            <option value="name-desc">Alphabetically reverse</option>
            <option value="added">Date added</option>
          </select>
        </label>
        <div id="catalog-list"></div>
        <p id="catalog-status"></p>
        <div class="dialog-actions">
          <span class="catalog-reorder">
            <button id="catalog-up" type="button" aria-label="Move up">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path fill="currentColor" d="M8 3.2 2.8 10.2h10.4L8 3.2Z" />
              </svg>
            </button>
            <button id="catalog-down" type="button" aria-label="Move down">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path fill="currentColor" d="M8 12.8 13.2 5.8H2.8L8 12.8Z" />
              </svg>
            </button>
          </span>
          <button id="catalog-rename" type="button" disabled>Rename</button>
          <button id="catalog-delete" type="button" disabled>Delete</button>
          <span class="dialog-actions-end">
            <button id="catalog-close" class="primary" type="button">Close</button>
          </span>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
